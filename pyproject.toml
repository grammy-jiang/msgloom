[project]
name = "msgloom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.161",
    "cyclopts==5.0.0",
    "defusedxml==0.7.1",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdfium2==5.13.0",
    "python-calamine==0.8.2",
    "python-docx==1.2.0",
    "selectolax==0.4.12",
    "msal==1.39.0",
    "scrapy==2.19.0",
    "sqlalchemy>=2.0.54,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["msgloom", "message_ingest", "microsoft_graph", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
extend-exclude = ["research"]
