[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msgloom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.161",
    "cyclopts==5.0.0",
    "defusedxml==0.7.1",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdfium2==5.13.0",
    "python-calamine==0.8.2",
    "python-docx==1.2.0",
    "selectolax==0.4.12",
    "msal==1.39.0",
    "scrapy==2.19.0",
    "sqlalchemy>=2.0.54,<2.1",
]

[project.scripts]
msgloom = "msgloom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
    "tox==4.64.4",
    "tox-uv==1.36.0",
]

compat-fastmcp4 = [
    "fastmcp==4.0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "exclusive_state: tests that must run serially outside xdist",
    "fastmcp_compat: tests requiring the opt-in FastMCP compatibility group",
]

[tool.pyright]
include = ["msgloom", "message_ingest", "microsoft_graph", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
extend-exclude = ["research"]


[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["msgloom", "msgloom.*", "message_ingest", "message_ingest.*",
           "microsoft_graph", "microsoft_graph.*"]
exclude = ["tests", "tests.*", "research", "research.*"]
namespaces = false

[tool.setuptools.package-data]
"msgloom.reporting" = ["templates/*.j2"]
msgloom = [
    "templates/*",
    "templates/**/*",
    "prompts/*",
    "prompts/**/*",
    "migrations/*",
    "migrations/**/*",
]

[tool.tox]
requires = ["tox==4.64.4", "tox-uv==1.36.0"]
env_list = [
    "py312",
    "py313",
    "py314",
    "py312-fastmcp4",
    "py313-fastmcp4",
    "py314-fastmcp4",
]
skip_missing_interpreters = false

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
set_env = { COVERAGE_FILE = "{env_dir}/.coverage" }
package = "wheel"
dependency_groups = ["dev"]
uv_sync_locked = true
commands = [
    ["python", "-m", "pytest", "-q", "-n", "4",
     "-m", "not exclusive_state and not fastmcp_compat",
     "--cov=msgloom", "--cov=message_ingest", "--cov=microsoft_graph",
     "--cov-branch", "--cov-report=term-missing",
     "--cov-report=xml:{env_dir}/coverage.xml"],
    ["python", "-m", "pytest", "-q", "-n", "0",
     "-m", "exclusive_state and not fastmcp_compat", "--cov=msgloom", "--cov=message_ingest",
     "--cov=microsoft_graph", "--cov-branch", "--cov-append",
     "--cov-report=term-missing",
     "--cov-report=xml:{env_dir}/coverage.xml"],
]

[tool.tox.env.py312-fastmcp4]
dependency_groups = ["dev", "compat-fastmcp4"]
set_env = { COVERAGE_FILE = "{env_dir}/.coverage", MSGLOOM_FASTMCP_COMPAT = "1" }
commands = [
    ["python", "-m", "pytest", "-q", "-m", "fastmcp_compat",
     "tests/packaging/test_fastmcp_compatibility.py",
     "--cov=msgloom", "--cov-branch", "--cov-report=term-missing",
     "--cov-report=xml:{env_dir}/coverage.xml"],
]

[tool.tox.env.py313-fastmcp4]
dependency_groups = ["dev", "compat-fastmcp4"]
set_env = { COVERAGE_FILE = "{env_dir}/.coverage", MSGLOOM_FASTMCP_COMPAT = "1" }
commands = [
    ["python", "-m", "pytest", "-q", "-m", "fastmcp_compat",
     "tests/packaging/test_fastmcp_compatibility.py",
     "--cov=msgloom", "--cov-branch", "--cov-report=term-missing",
     "--cov-report=xml:{env_dir}/coverage.xml"],
]

[tool.tox.env.py314-fastmcp4]
dependency_groups = ["dev", "compat-fastmcp4"]
set_env = { COVERAGE_FILE = "{env_dir}/.coverage", MSGLOOM_FASTMCP_COMPAT = "1" }
commands = [
    ["python", "-m", "pytest", "-q", "-m", "fastmcp_compat",
     "tests/packaging/test_fastmcp_compatibility.py",
     "--cov=msgloom", "--cov-branch", "--cov-report=term-missing",
     "--cov-report=xml:{env_dir}/coverage.xml"],
]
