[project]
name = "msgloom"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "msal==1.39.0",
    "scrapy==2.19.0",
    "sqlalchemy>=2.0.54,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["message_ingest", "microsoft_graph", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py313"
extend-exclude = ["research"]
