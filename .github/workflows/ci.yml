name: CI

on:
  # Run the full matrix for master and PRs, not twice for each feature push.
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and native Scrapy contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
      - name: Classify documentation-only changes
        id: change_scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PYTHON: 3.13
        run: |
          uv run --no-project --python "$CI_PYTHON" python \
            scripts/quality/ci_change_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA" \
            --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Cache the installed hook environments, especially Gitleaks' Go build.
      # Revision changes invalidate this store; the uv cache is independent.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: precommit-v1-${{ runner.os }}-${{ runner.arch }}-py313-node24-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install locked development dependencies
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: uv sync --locked --group dev
      - name: Ruff checks
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: |
          uv run --no-sync ruff check microsoft_graph message_ingest msgloom scripts tests
          uv run --no-sync ruff format --check microsoft_graph message_ingest msgloom scripts tests
      - name: Pyright
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: >-
          npx --yes --package pyright@1.1.413 pyright
          --pythonpath .venv/bin/python microsoft_graph message_ingest msgloom tests
      # Pin upstream actionlint's published archive by SHA-256; no Go
      # toolchain or mutable installer is needed on the CI runner.
      - name: Actionlint workflow validation
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_arm64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6' \
            "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color=false
      # Reuse existing A1-to-A2 / Graph import boundary checks.  Keep these
      # separate from handoff runtime qualification (which requires cgroups).
      - name: Architecture boundaries
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: |
          uv run --no-sync python -c 'from pathlib import Path; from scripts.handoff_qualification.audit import reverse_imports; reverse_imports(Path.cwd())'
          uv run --no-sync python -m pytest -q -n 0 \
            tests/test_microsoft_graph_package_layout.py::test_graph_package_does_not_depend_on_message_ingest
      - name: Native Scrapy callback contracts against local Graph fixtures
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: uv run --no-sync pytest -q -n 0 tests/test_teams_native_contracts.py
      - name: Existing pre-commit checks on the branch changes
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base=$(git merge-base "origin/$BASE_BRANCH" HEAD)
          elif [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base=$BEFORE_SHA
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          uv tool run --from pre-commit==4.6.2 pre-commit run \
            --from-ref "$base" --to-ref HEAD --show-diff-on-failure
          git diff --exit-code

  tests:
    name: Tests (${{ matrix.tox-env }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            tox-env: py312
          - python: "3.13"
            tox-env: py313
          - python: "3.14"
            tox-env: py314
          - python: "3.12"
            tox-env: py312-fastmcp4
          # The FastMCP unit probe simulates exact Python 3.13.5.
          - python: "3.13"
            tox-env: py313-fastmcp4
          - python: "3.14"
            tox-env: py314-fastmcp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: ${{ matrix.tox-env }}
      - name: Classify documentation-only changes
        id: change_scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PYTHON: ${{ matrix.python }}
        run: |
          uv run --no-project --python "$CI_PYTHON" python \
            scripts/quality/ci_change_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA" \
            --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Install required process isolation
        if: ${{ steps.change_scope.outputs.docs_only != 'true' && !contains(matrix.tox-env, 'fastmcp') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap
          profile="$GITHUB_WORKSPACE/.github/apparmor/bwrap-userns-restrict"
          profile_sha256="11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9"
          printf '%s  %s\n' "$profile_sha256" "$profile" | sha256sum --check --strict -
          test -r /etc/apparmor.d/abi/4.0
          sudo apparmor_parser --replace --skip-cache "$profile"
          bwrap --die-with-parent --unshare-all \
            --ro-bind /usr /usr --ro-bind /lib /lib \
            --proc /proc --dev /dev /usr/bin/true
      - name: Docs-only fast path (runtime suites unchanged)
        if: ${{ steps.change_scope.outputs.docs_only == 'true' }}
        run: echo "Docs-only diff; all non-docs changes still require every tox matrix."
      - name: Install locked development dependencies
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: uv sync --locked --group dev
      # Portable tox checks must not need delegated Linux cgroups.
      # Real OS-specific process safety is verified in a separate required job.
      - name: Run the existing tox environment
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        env:
          TOX_ENVIRONMENT: ${{ matrix.tox-env }}
        run: uv run --no-sync tox run -e "$TOX_ENVIRONMENT"
      # Evaluate coverage after both tox phases. The first pytest invocation
      # cannot be gated independently because its coverage is incomplete.
      - name: Enforce line and branch coverage budgets
        if: ${{ steps.change_scope.outputs.docs_only != 'true' && !contains(matrix.tox-env, 'fastmcp') }}
        run: >-
          uv run --no-sync python scripts/quality/coverage_gate.py
          .tox/${{ matrix.tox-env }}/coverage.xml
      - name: Qualify the rebuilt wheel outside the checkout
        if: ${{ steps.change_scope.outputs.docs_only != 'true' && !contains(matrix.tox-env, 'fastmcp') }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip sync --python "$RUNNER_TEMP/wheel-env/bin/python" \
            "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --no-sync python scripts/qualify_installed_wheel.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output-root "$RUNNER_TEMP/wheel-qualification" \
            --env-python "$RUNNER_TEMP/wheel-env/bin/python" \
            --uv "$(command -v uv)" --require-cli msgloom \
            --require-resource msgloom.reporting:templates/report.txt.j2 \
            --require-resource msgloom.reporting:templates/report.html.j2
      - name: Preserve coverage and qualification evidence
        if: ${{ always() && steps.change_scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.tox-env }}
          path: |
            .tox/${{ matrix.tox-env }}/coverage.xml
            .tox/${{ matrix.tox-env }}/log/
            ${{ runner.temp }}/wheel-qualification/qualification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  linux_safety:
    name: Linux cgroup-v2 safety contracts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
      - name: Classify documentation-only changes
        id: change_scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PYTHON: 3.13
        run: |
          uv run --no-project --python "$CI_PYTHON" python \
            scripts/quality/ci_change_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA" \
            --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Docs-only fast path (kernel contracts unchanged)
        if: ${{ steps.change_scope.outputs.docs_only == 'true' }}
        run: echo "Docs-only diff; kernel safety suite remains required for code changes."
      - name: Install locked test dependencies
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: uv sync --locked --group dev
      - name: Require real delegated Linux cgroup-v2 execution
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: |
          sudo systemd-run --quiet --wait --collect --pipe \
            --uid "$(id -un)" --property=Delegate=yes \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv=HOME="$HOME" --setenv=PATH="$PATH" \
            --setenv=CI=true --setenv=RUNNER_TEMP="$RUNNER_TEMP" \
            /bin/bash -euc '
              uv run --no-sync python -c "from scripts.handoff_qualification.process_boundary import check_supported; check_supported()"
              uv run --no-sync pytest -q -n 0 --strict-markers \
                -m linux_cgroup_v2 --junitxml="$RUNNER_TEMP/linux-cgroup.xml"
            '
      - name: Enforce complete Linux safety coverage
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          path = Path(os.environ["RUNNER_TEMP"]) / "linux-cgroup.xml"
          cases = list(ElementTree.parse(path).getroot().iter("testcase"))
          skipped = sum(case.find("skipped") is not None for case in cases)
          # The 2026-10-08 portable split identifies 36 real cgroup cases.
          if len(cases) < 36 or skipped:
              raise SystemExit(
                  f"Native safety coverage incomplete: {len(cases)} cases, "
                  f"{skipped} skipped"
              )
          print(f"Native safety coverage verified: {len(cases)} executed cases")
          PYCODE
      - name: Preserve Linux safety evidence
        if: ${{ always() && steps.change_scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-cgroup-v2-evidence
          path: ${{ runner.temp }}/linux-cgroup.xml
          if-no-files-found: warn
          retention-days: 14

  portability:
    name: Portable smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ matrix.os }}
      - name: Classify documentation-only changes
        id: change_scope
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PYTHON: 3.13
        run: |
          uv run --no-project --python "$CI_PYTHON" python \
            scripts/quality/ci_change_scope.py \
            --event "$GITHUB_EVENT_NAME" --base "$CI_BASE_SHA" \
            --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Docs-only fast path (portable contracts unchanged)
        if: ${{ steps.change_scope.outputs.docs_only == 'true' }}
        run: echo "Docs-only diff; portable smoke is mandatory for code changes."
      # Install only dependencies used by these portable contracts; unrelated
      # product dependencies must not gate the cross-platform smoke suite.
      - name: Run portable business and framework contracts
        if: ${{ steps.change_scope.outputs.docs_only != 'true' }}
        run: >-
          uv run --no-project --python 3.13 --with pytest==8.4.2
          --with scrapy==2.19.0 --with sqlalchemy==2.0.54
          python -m pytest -q --strict-markers
          tests/test_graph_protocol.py
          tests/test_graph_framework_spider.py
          tests/packaging/test_packaging_config.py
          tests/test_handoff_qualification_runner.py::test_default_cli_lists_without_creating_runtime_evidence
          tests/test_handoff_qualification_portable.py::test_coverage_map_requires_all_spiders_scenarios_and_executed_nodes
          tests/test_handoff_qualification_portable.py::test_reverse_import_scan_rejects_a2_and_dynamic_imports
